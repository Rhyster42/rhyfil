<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h3>Logged-in-name</h3>
        <h3>admin-icon</h3>
    </header>
    <div class="stage">
        <div class="menu">
            <h2>Menu</h2>
            <table id="menu-table">
                
            </table>
        </div>
        <div class="modifiers">
            <h2>Modifiers</h2>
            <table id="modifier-table">
            </table>
        </div>
        <div class="cart">
            <h2>Order</h2>
            <table id="cart-table">
            </table>
            <h3 id="total-display">Total: <text id="cart-total"></text></h3>
        </div>
    </div>
    <footer>
        <button type="button" id="add_button">Add To Cart</button>
        <button type="button">Check Out</button>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
